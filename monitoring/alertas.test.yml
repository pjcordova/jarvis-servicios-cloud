# Pruebas de las reglas de alerta (series simuladas, sin levantar nada):
#   docker run --rm -v "<ruta>/monitoreo:/m" --entrypoint promtool prom/prometheus:v3.13.5 test rules /m/alertas.test.yml
rule_files:
  - alertas.yml

evaluation_interval: 15s

tests:
  # Jarvis cae a los 30 s: a 1 min sigue "pendiente"; a los 2 min la alerta ya está disparada.
  - interval: 15s
    input_series:
      - series: 'up{job="jarvis", instance="jarvis:9464"}'
        values: "1 1 0x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: JarvisCaido
        exp_alerts: []
      - eval_time: 2m
        alertname: JarvisCaido
        exp_alerts:
          - exp_labels:
              severity: critica
              job: jarvis
              instance: "jarvis:9464"
            exp_annotations:
              resumen: Jarvis no responde hace más de 1 minuto.
              accion: Docker lo reinicia solo. Si sigue caído, revisa "docker compose logs jarvis".

  # 2 de cada 12 llamadas fallan (16,67 %) durante varios minutos: se dispara.
  - interval: 15s
    input_series:
      - series: 'jarvis_modelo_solicitudes_total{modelo="gemini-3.8-flash", resultado="ok"}'
        values: "0+10x30"
      - series: 'jarvis_modelo_solicitudes_total{modelo="gemini-3.8-flash", resultado="error_temporal"}'
        values: "0+2x30"
    alert_rule_test:
      - eval_time: 1m
        alertname: ErroresDeModelo
        exp_alerts: []
      - eval_time: 4m
        alertname: ErroresDeModelo
        exp_alerts:
          - exp_labels:
              severity: advertencia
            exp_annotations:
              resumen: "Fallan más del 5 % de las llamadas a Gemini (16.67%)."
              accion: Revisa si Gemini está saturado (504). El respaldo debería estar respondiendo; si también falla, revisa la API key y la cuota.

  # Casi sin tráfico (2 llamadas, ambas con error): no es una tendencia, no avisa.
  - interval: 15s
    input_series:
      - series: 'jarvis_modelo_solicitudes_total{modelo="gemini-3.8-flash", resultado="error"}'
        values: "0 0 1 1 1 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2"
    alert_rule_test:
      - eval_time: 5m
        alertname: ErroresDeModelo
        exp_alerts: []

  # 450 MB de 512 MB (87,89 %) por más de 5 minutos: se dispara.
  - interval: 1m
    input_series:
      - series: 'jarvis_process_resident_memory_bytes{job="jarvis", instance="jarvis:9464"}'
        values: "471859200x10"
      - series: 'jarvis_memoria_limite_bytes{job="jarvis", instance="jarvis:9464"}'
        values: "536870912x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: MemoriaAlta
        exp_alerts: []
      - eval_time: 7m
        alertname: MemoriaAlta
        exp_alerts:
          - exp_labels:
              severity: advertencia
              job: jarvis
              instance: "jarvis:9464"
            exp_annotations:
              resumen: "Jarvis usa el 87.89% de su límite de memoria."
              accion: Si llega al 100 %, el kernel lo mata (OOM). Sube mem_limit (escalado vertical) o busca qué está consumiendo memoria.

  # Jarvis como servicio: un pago reportado más de 1 hora se avisa; sin lecturas por 3 horas, también.
  - interval: 1m
    input_series:
      - series: 'jarvis_servicio_pagos{origen="produccion", estado="reportado"}'
        values: "1x90"
      - series: 'jarvis_servicio_ultima_lectura_timestamp_segundos{origen="produccion"}'
        values: "0x200"
    alert_rule_test:
      - eval_time: 30m
        alertname: PagosPorConfirmar
        exp_alerts: []
      - eval_time: 80m
        alertname: PagosPorConfirmar
        exp_alerts:
          - exp_labels:
              severity: advertencia
            exp_annotations:
              resumen: "Hay 1 pago(s) reportado(s) esperando tu confirmación."
              accion: Entra al panel, Más → Cobros, y confírmalos o recházalos. Jarvis nunca los confirma solo.
      - eval_time: 3h15m
        alertname: ServicioSinMetricas
        exp_alerts:
          - exp_labels:
              severity: advertencia
            exp_annotations:
              resumen: Hace más de 3 horas que no llegan los totales de Jarvis como servicio.
              accion: 'Revisa "docker compose logs metricas-servicio": falta .env.servicio, cambió la contraseña de jarvis_metricas o Neon no responde.'

  # Respaldo: el último bueno fue hace 31 horas (en t=0 la serie vale "hace 31 h"): la alerta se dispara.
  - interval: 1m
    input_series:
      - series: 'jarvis_servicio_respaldo_ultimo_ok_timestamp_segundos{origen="produccion"}'
        values: "-111600x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: RespaldoAtrasado
        exp_alerts:
          - exp_labels:
              severity: critica
            exp_annotations:
              resumen: El último respaldo bueno de Neon tiene más de 30 horas.
              accion: 'Revisa "docker compose logs respaldo" en la VM (contraseña de jarvis_respaldo, la cuenta de servicio o el bucket) y hazlo a mano con "docker compose exec respaldo /app/respaldar.sh".'

  # La máquina (node-exporter). Las 2 vCPU están al 95 % de uso: en reposo suman 2 s de idle por segundo;
  # aquí suben solo 0,1 s, o sea 0,05 s por CPU. A los 10 minutos la alerta se dispara.
  - interval: 15s
    input_series:
      - series: 'node_cpu_seconds_total{cpu="0", mode="idle", instance="node-exporter:9100"}'
        values: "0+0.75x60"
      - series: 'node_cpu_seconds_total{cpu="1", mode="idle", instance="node-exporter:9100"}'
        values: "0+0.75x60"
    alert_rule_test:
      - eval_time: 5m
        alertname: VMCPUAlta
        exp_alerts: []
      - eval_time: 11m
        alertname: VMCPUAlta
        exp_alerts:
          - exp_labels:
              severity: advertencia
            exp_annotations:
              resumen: La VM usa el 95 % de su CPU hace 10 minutos.
              accion: Mira en Grafana qué contenedor consume (panel CPU por contenedor). Si es sostenido, toca una máquina más grande (escalado vertical).

  # De 4 GB quedan 400 MB disponibles: 10 %, por debajo del 15 % que exige la alerta.
  - interval: 15s
    input_series:
      - series: 'node_memory_MemTotal_bytes{instance="node-exporter:9100"}'
        values: "4000000000x40"
      - series: 'node_memory_MemAvailable_bytes{instance="node-exporter:9100"}'
        values: "400000000x40"
    alert_rule_test:
      - eval_time: 6m
        alertname: VMMemoriaDisponibleBaja
        exp_alerts:
          - exp_labels:
              severity: critica
              instance: "node-exporter:9100"
            exp_annotations:
              resumen: A la VM le queda el 10 % de memoria disponible.
              accion: 'Sin swap, el kernel empieza a matar procesos (OOM). Revisa "docker stats" y baja algún mem_limit o apaga un Jarvis de cliente.'

  # Disco de 20 GB con 2 GB libres: 10 % libre, por debajo del 15 %. A los 10 minutos salta.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{mountpoint="/", fstype="ext4", instance="node-exporter:9100"}'
        values: "20000000000x30"
      - series: 'node_filesystem_avail_bytes{mountpoint="/", fstype="ext4", instance="node-exporter:9100"}'
        values: "2000000000x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: VMDiscoLleno
        exp_alerts: []
      - eval_time: 11m
        alertname: VMDiscoLleno
        exp_alerts:
          # min() se queda sin etiquetas: la alerta es de la VM, no de un punto de montaje.
          - exp_labels:
              severity: advertencia
            exp_annotations:
              resumen: Al disco de la VM le queda el 10 % libre.
              accion: 'Lo más pesado suele ser Docker: "docker system prune -a" borra imágenes y capas sin usar. Prometheus guarda 15 días de series.'

  # cAdvisor deja de responder a los 30 s: a los 2 minutos se avisa, porque sin él no hay métricas.
  - interval: 30s
    input_series:
      - series: 'up{job="contenedores", instance="cadvisor:8080"}'
        values: "1 0x10"
      - series: 'up{job="maquina", instance="node-exporter:9100"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: ExportadorCaido
        exp_alerts: []
      - eval_time: 3m
        alertname: ExportadorCaido
        exp_alerts:
          - exp_labels:
              severity: advertencia
              job: contenedores
              instance: "cadvisor:8080"
            exp_annotations:
              resumen: El exportador de contenedores no responde hace más de 2 minutos.
              accion: 'Sin él no hay métricas de la VM ni de los contenedores. Revisa "docker compose logs node-exporter cadvisor"; Docker los reinicia solo.'

  # Un contenedor usa 440 MB de su límite de 512 MB (85,94 %): pasa del 80 %.
  - interval: 15s
    input_series:
      - series: 'container_memory_working_set_bytes{name="jarvis-demo", instance="cadvisor:8080"}'
        values: "461373440x40"
      - series: 'container_spec_memory_limit_bytes{name="jarvis-demo", instance="cadvisor:8080"}'
        values: "536870912x40"
    alert_rule_test:
      - eval_time: 2m
        alertname: ContenedorMemoriaAlta
        exp_alerts: []
      - eval_time: 6m
        alertname: ContenedorMemoriaAlta
        exp_alerts:
          - exp_labels:
              severity: advertencia
              name: jarvis-demo
              instance: "cadvisor:8080"
            exp_annotations:
              resumen: jarvis-demo usa el 85.94% de su límite de memoria.
              accion: Al llegar al 100 % el kernel lo mata y Docker lo reinicia. Sube su mem_limit en docker-compose.yml o revisa qué consume.

  # Un contenedor en bucle: arranca 4 veces en 15 minutos (3 reinicios). Sin "for": se avisa de inmediato.
  - interval: 1m
    input_series:
      # Cada escalón es un arranque nuevo (el valor es cuándo arrancó, en segundos).
      - series: 'container_start_time_seconds{name="jarvis-demo", instance="cadvisor:8080"}'
        values: "100x3 400x3 700x3 1000x8"
    alert_rule_test:
      - eval_time: 2m
        alertname: ContenedorReiniciandose
        exp_alerts: []
      - eval_time: 12m
        alertname: ContenedorReiniciandose
        exp_alerts:
          - exp_labels:
              severity: advertencia
              name: jarvis-demo
              instance: "cadvisor:8080"
            exp_annotations:
              resumen: jarvis-demo se reinició 3 veces en 15 minutos.
              accion: 'Suele ser el kernel matándolo por memoria (OOM) o un error al arrancar. Mira "docker compose logs --tail 50 <servicio>" y su mem_limit.'
