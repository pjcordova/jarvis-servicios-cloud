# Reglas de alerta de Jarvis: qué pasa, cuánto tiempo tiene que durar y qué hacer.
# Prometheus las evalúa cada 15 s. Alertmanager las agrupa y avisa (ver alertmanager.yml).
# Pruebas: monitoreo/alertas.test.yml (promtool test rules).
groups:
  - name: jarvis
    rules:
      - alert: JarvisCaido
        expr: up{job="jarvis"} == 0
        for: 1m
        labels:
          severity: critica
        annotations:
          resumen: Jarvis no responde hace más de 1 minuto.
          accion: Docker lo reinicia solo. Si sigue caído, revisa "docker compose logs jarvis".

      # Con un mínimo de tráfico: 1 error en 2 llamadas no es una tendencia.
      - alert: ErroresDeModelo
        expr: |
          (
            sum(rate(jarvis_modelo_solicitudes_total{resultado!="ok"}[5m]))
            / sum(rate(jarvis_modelo_solicitudes_total[5m]))
          ) > 0.05
          and sum(increase(jarvis_modelo_solicitudes_total[5m])) >= 3
        for: 2m
        labels:
          severity: advertencia
        annotations:
          resumen: "Fallan más del 5 % de las llamadas a Gemini ({{ $value | humanizePercentage }})."
          accion: Revisa si Gemini está saturado (504). El respaldo debería estar respondiendo; si también falla, revisa la API key y la cuota.

      - alert: JarvisLento
        expr: histogram_quantile(0.95, sum by (le) (rate(jarvis_herramienta_duracion_segundos_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: advertencia
        annotations:
          resumen: "El 95 % de las herramientas tarda hasta {{ $value | humanizeDuration }} (objetivo: menos de 5 s)."
          accion: Mira en Grafana qué herramienta se demora (panel Herramientas p95) y si Gemini o Google Calendar están lentos.

      - alert: MemoriaAlta
        expr: jarvis_process_resident_memory_bytes / jarvis_memoria_limite_bytes > 0.8
        for: 5m
        labels:
          severity: advertencia
        annotations:
          resumen: "Jarvis usa el {{ $value | humanizePercentage }} de su límite de memoria."
          accion: Si llega al 100 %, el kernel lo mata (OOM). Sube mem_limit (escalado vertical) o busca qué está consumiendo memoria.

  # La máquina y los contenedores (node-exporter y cAdvisor). La VM es e2-medium: 2 vCPU, 4 GB y sin swap,
  # así que quedarse sin memoria no se amortigua: el kernel mata el proceso que más usa.
  # Los nombres, umbrales y duraciones son los de la Tabla 26 del informe del curso.
  - name: infraestructura
    rules:
      - alert: VMCPUAlta
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 10m
        labels:
          severity: advertencia
        annotations:
          resumen: "La VM usa el {{ $value | printf \"%.0f\" }} % de su CPU hace 10 minutos."
          accion: Mira en Grafana qué contenedor consume (panel CPU por contenedor). Si es sostenido, toca una máquina más grande (escalado vertical).

      # Se mide la memoria DISPONIBLE, no la usada: lo que importa sin swap es cuánto queda antes del OOM.
      - alert: VMMemoriaDisponibleBaja
        expr: 100 * (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 15
        for: 5m
        labels:
          severity: critica
        annotations:
          resumen: "A la VM le queda el {{ $value | printf \"%.0f\" }} % de memoria disponible."
          accion: 'Sin swap, el kernel empieza a matar procesos (OOM). Revisa "docker stats" y baja algún mem_limit o apaga un Jarvis de cliente.'

      # Por el disco con menos espacio libre, no por un punto de montaje fijo: con --path.rootfs el nombre
      # cambia según el sistema (en la VM es "/", en Docker Desktop son rutas de WSL). Solo discos de verdad.
      - alert: VMDiscoLleno
        expr: 100 * min(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}) < 15
        for: 10m
        labels:
          severity: advertencia
        annotations:
          resumen: "Al disco de la VM le queda el {{ $value | printf \"%.0f\" }} % libre."
          accion: 'Lo más pesado suele ser Docker: "docker system prune -a" borra imágenes y capas sin usar. Prometheus guarda 15 días de series.'

      # El punto ciego del monitoreo: si quien mide deja de responder, deja de haber alertas de la máquina.
      - alert: ExportadorCaido
        expr: up{job=~"maquina|contenedores"} == 0
        for: 2m
        labels:
          severity: advertencia
        annotations:
          resumen: "El exportador de {{ $labels.job }} no responde hace más de 2 minutos."
          accion: 'Sin él no hay métricas de la VM ni de los contenedores. Revisa "docker compose logs node-exporter cadvisor"; Docker los reinicia solo.'

      - alert: ContenedorMemoriaAlta
        expr: |
          container_memory_working_set_bytes{name!=""}
          / container_spec_memory_limit_bytes{name!=""} > 0.8
          and container_spec_memory_limit_bytes{name!=""} > 0
        for: 5m
        labels:
          severity: advertencia
        annotations:
          resumen: "{{ $labels.name }} usa el {{ $value | humanizePercentage }} de su límite de memoria."
          accion: Al llegar al 100 % el kernel lo mata y Docker lo reinicia. Sube su mem_limit en docker-compose.yml o revisa qué consume.

      # Reiniciarse una vez es normal; hacerlo tres veces en 15 minutos es un bucle (OOM o un error al arrancar).
      # Sin "for": se avisa de inmediato, porque cada reinicio es un corte de servicio.
      - alert: ContenedorReiniciandose
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        labels:
          severity: advertencia
        annotations:
          resumen: "{{ $labels.name }} se reinició {{ $value }} veces en 15 minutos."
          accion: 'Suele ser el kernel matándolo por memoria (OOM) o un error al arrancar. Mira "docker compose logs --tail 50 <servicio>" y su mem_limit.'

  # Jarvis como servicio (panel en Vercel + Neon): lo lee el colector de servicio-metricas una vez por hora.
  - name: servicio
    rules:
      - alert: ServicioSinMetricas
        expr: time() - max(jarvis_servicio_ultima_lectura_timestamp_segundos) > 3 * 3600
        for: 10m
        labels:
          severity: advertencia
        annotations:
          resumen: Hace más de 3 horas que no llegan los totales de Jarvis como servicio.
          accion: 'Revisa "docker compose logs metricas-servicio": falta .env.servicio, cambió la contraseña de jarvis_metricas o Neon no responde.'

      - alert: PagosPorConfirmar
        expr: sum(jarvis_servicio_pagos{estado="reportado"}) > 0
        for: 1h
        labels:
          severity: advertencia
        annotations:
          resumen: "Hay {{ $value }} pago(s) reportado(s) esperando tu confirmación."
          accion: Entra al panel, Más → Cobros, y confírmalos o recházalos. Jarvis nunca los confirma solo.

      - alert: EncargosFallando
        expr: sum(jarvis_servicio_encargos_24h{estado="fallido"}) >= 10
        for: 1h
        labels:
          severity: advertencia
        annotations:
          resumen: "{{ $value }} encargos fallaron en las últimas 24 horas."
          accion: Mira en Grafana qué agente falla (panel Encargos por estado) y revisa los logs de Vercel o el sistema conectado.

      - alert: RespaldoAtrasado
        expr: time() - max(jarvis_servicio_respaldo_ultimo_ok_timestamp_segundos) > 30 * 3600
        for: 10m
        labels:
          severity: critica
        annotations:
          resumen: El último respaldo bueno de Neon tiene más de 30 horas.
          accion: 'Revisa "docker compose logs respaldo" en la VM (contraseña de jarvis_respaldo, la cuenta de servicio o el bucket) y hazlo a mano con "docker compose exec respaldo /app/respaldar.sh".'
